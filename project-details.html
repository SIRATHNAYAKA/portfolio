<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Study — Sachin Rathnayaka</title>
<meta name="description" content="Project case study by Sachin Rathnayaka.">
<meta name="theme-color" content="#050816">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<script src="assets/js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<style>
  .case-hero { max-width: 900px; margin-bottom: 4rem; }
  .case-hero__title { font-size: var(--fs-3xl); letter-spacing: -0.03em; margin-bottom: 1rem; }
  .case-hero__lead { font-size: var(--fs-md); color: var(--text-muted); max-width: 720px; margin-bottom: 2rem; }
  .case-hero__meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.5rem; padding: 1.5rem 0; border-block: 1px solid var(--border); margin-bottom: 2rem; }
  .case-hero__meta span { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-dim); margin-bottom: 6px; }
  .case-hero__meta strong { font-size: var(--fs-sm); color: var(--text); font-weight: 500; }
  .case-hero__media { border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); aspect-ratio: 16/9; background: var(--bg-2); }
  .case-hero__media img { width: 100%; height: 100%; object-fit: cover; }
  .case-body { max-width: 820px; }
  .case-section { margin-bottom: 3rem; }
  .case-section h2 { font-size: var(--fs-xl); margin-bottom: 1rem; color: var(--text); }
  .case-list { display: grid; gap: 0.5rem; }
  .case-list li { padding-left: 24px; position: relative; color: var(--text-muted); font-size: var(--fs-sm); }
  .case-list li::before { content: "→"; position: absolute; left: 0; color: var(--accent); }
  .case-tech { display: flex; flex-wrap: wrap; gap: 8px; }
  .case-tech li { padding: 6px 14px; border: 1px solid var(--border-strong); border-radius: 100px; font-size: 0.78rem; color: var(--text); }
  .case-shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
  .case-shot { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
  .case-shot img { width: 100%; height: auto; display: block; }
  .case-actions { display: flex; flex-wrap: wrap; gap: 12px; padding-top: 2rem; border-top: 1px solid var(--border); }
</style>
</head>

<body data-page="project-details">
<div class="cursor" aria-hidden="true"><div class="cursor__dot"></div><div class="cursor__ring"></div></div>
<a class="skip-link" href="#main">Skip to main content</a>
<div id="site-header"></div>

<main id="main" style="padding-top:calc(var(--header-h) + 4rem);padding-bottom:4rem">
  <div class="container">
    <div id="caseStudy"></div>
  </div>
</main>

<div id="site-footer"></div>
<button class="to-top" id="toTop" aria-label="Back to top"><span data-icon="arrow-up"></span></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data/projects.js"></script>
<script src="assets/js/main.js" defer></script>
<script src="assets/js/animations.js" defer></script>
<script src="assets/js/projects.js" defer></script>
</body>
</html>
