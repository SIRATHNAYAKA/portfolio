<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page Not Found | Sachin Rathnayaka</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050816">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<script src="assets/js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<style>
  .err {
    min-height: 100svh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 6rem 1rem;
    position: relative;
    overflow: hidden;
  }
  .err__code {
    font-family: var(--font-display);
    font-size: clamp(6rem, 20vw, 16rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.05em;
    background: linear-gradient(180deg, var(--text), transparent 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 1rem;
  }
  .err__title {
    font-size: var(--fs-2xl);
    margin-bottom: 1rem;
  }
  .err__text {
    max-width: 480px;
    margin: 0 auto 2rem;
    color: var(--text-muted);
  }
  .err__actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .err__bg {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, var(--accent-soft), transparent 60%);
    pointer-events: none;
    z-index: -1;
  }
</style>
</head>

<body data-page="404">
<div class="cursor" aria-hidden="true"><div class="cursor__dot"></div><div class="cursor__ring"></div></div>
<a class="skip-link" href="#main">Skip to main content</a>
<div id="site-header"></div>

<main id="main">
  <section class="err">
    <div class="err__bg" aria-hidden="true"></div>
    <div>
      <p class="err__code">404</p>
      <h1 class="err__title">Page not found.</h1>
      <p class="err__text">
        The page you're looking for doesn't exist or has been moved.
        Let's get you back on track.
      </p>
      <div class="err__actions">
        <a href="index.html" class="btn btn--primary magnetic">Back to Home <span data-icon="arrow-right"></span></a>
        <a href="projects.html" class="btn btn--ghost">View Projects</a>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/main.js" defer></script>
<script src="assets/js/animations.js" defer></script>
</body>
</html>
